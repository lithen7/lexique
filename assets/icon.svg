<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#F4F6F9"/>
      <stop offset="1" stop-color="#E3E8EF"/>
    </linearGradient>

    <linearGradient id="tint" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#8FB7FF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8FB7FF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23272E"/>
      <stop offset="1" stop-color="#414852"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4C8DFF"/>
      <stop offset="1" stop-color="#7FB0FF"/>
    </linearGradient>

    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="halo" cx="0.28" cy="0.16" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#0B1220" flood-opacity="0.22"/>
    </filter>

    <filter id="innerLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feOffset dx="0" dy="2" result="offset"/>
      <feComposite in="SourceAlpha" in2="offset" operator="out" result="edge"/>
      <feFlood flood-color="#FFFFFF" flood-opacity="0.75"/>
      <feComposite in2="edge" operator="in" result="line"/>
      <feMerge><feMergeNode in="line"/></feMerge>
    </filter>

    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0B1220" flood-opacity="0.14"/>
    </filter>

    <filter id="blur18"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <!-- macOS app icon grid: 1024 canvas, 824 x 824 squircle -->
  <g transform="translate(100 100)">
    <rect x="0" y="0" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#softShadow)"/>
    <rect x="0" y="0" width="824" height="824" rx="185" fill="url(#tint)"/>
    <rect x="0" y="0" width="824" height="824" rx="185" fill="url(#halo)"/>

    <!-- glass edge -->
    <rect x="1.5" y="1.5" width="821" height="821" rx="183.5" fill="none"
          stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="3"/>
    <rect x="1.5" y="1.5" width="821" height="821" rx="183.5" fill="none"
          stroke="#9AA6B8" stroke-opacity="0.18" stroke-width="1"/>

    <!-- upper gloss -->
    <path d="M0 185 A185 185 0 0 1 185 0 H639 A185 185 0 0 1 824 185 V300 Q412 400 0 300 Z"
          fill="url(#gloss)" opacity="0.55" filter="url(#blur18)"/>

    <!-- wordmark -->
    <text x="412" y="500" text-anchor="middle"
          font-family="'SF Pro Display','SF Pro Rounded','Helvetica Neue',Helvetica,Arial,sans-serif"
          font-size="322" font-weight="700" letter-spacing="4"
          fill="url(#ink)" filter="url(#textShadow)">Lex</text>

    <!-- rule -->
    <rect x="307" y="558" width="210" height="12" rx="6" fill="url(#rule)" opacity="0.9"/>

    <!-- lower glass reflection -->
    <path d="M0 640 Q412 720 824 640 V639 A185 185 0 0 1 639 824 H185 A185 185 0 0 1 0 639 Z"
          fill="#FFFFFF" opacity="0.28" filter="url(#blur18)"/>
  </g>
</svg>
